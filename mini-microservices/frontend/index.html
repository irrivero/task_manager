<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mini Microservices Task Manager</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<div class="container">
		<h1>Task Manager - Microservices Demo</h1>

		<!-- Auth Section -->
		<div id="auth-section" class="section">
			<div class="auth-tabs">
				<button id="login-tab" class="tab-button active">Login</button>
				<button id="register-tab" class="tab-button">Register</button>
			</div>

			<!-- Login Form -->
			<form id="login-form" class="auth-form">
				<input type="text" id="login-username" placeholder="Username" required>
				<input type="password" id="login-password" placeholder="Password" required>
				<button type="submit">Login</button>
			</form>

			<!-- Register Form -->
			<form id="register-form" class="auth-form hidden">
				<input type="text" id="register-username" placeholder="Username" required>
				<input type="email" id="register-email" placeholder="Email" required>
				<input type="password" id="register-password" placeholder="Password" required>
				<button type="submit">Register</button>
			</form>

			<div class="test-accounts">
				<p><strong>Test Account:</strong> Username: admin, Password: password123</p>
			</div>
		</div>

		<!-- User Info Section -->
		<div id="user-section" class="section hidden">
			<div class="user-info">
				<span id="user-welcome">Welcome, User!</span>
				<button id="logout-btn" class="logout-button">Logout</button>
			</div>
		</div>

		<!-- Tasks Section -->
		<div id="tasks-section" class="section hidden">
			<h2>Your Tasks</h2>

			<!-- Add New Task Form -->
			<form id="task-form" class="task-form">
				<input type="text" id="task-title" placeholder="Task title" required>
				<input type="text" id="task-description" placeholder="Task description">
				<button type="submit">Add Task</button>
			</form>

			<!-- Tasks List -->
			<div id="tasks-list" class="tasks-container">
				<p class="loading">Loading tasks...</p>
			</div>
		</div>

		<!-- Service Status -->
		<div class="service-status">
			<h3>Service Health</h3>
			<div class="status-indicators">
				<span class="status" id="gateway-status">Gateway: <span class="status-light">○</span></span>
				<span class="status" id="user-service-status">User Service: <span class="status-light">○</span></span>
				<span class="status" id="task-service-status">Task Service: <span class="status-light">○</span></span>
			</div>
		</div>
	</div>

	<!-- Message Display -->
	<div id="message" class="message hidden"></div>

	<script src="app.js"></script>
</body>

</html>
