<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Task Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f4f4;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: #007bff;
            color: white;
            padding: 1rem;
            text-align: center;
            margin-bottom: 2rem;
            border-radius: 5px;
        }

        .auth-section, .task-section {
            background: white;
            padding: 2rem;
            margin-bottom: 2rem;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 3px;
            font-size: 1rem;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            background: #007bff;
            color: white;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 1rem;
            margin-right: 0.5rem;
        }

        button:hover {
            background: #0056b3;
        }

        button.danger {
            background: #dc3545;
        }

        button.danger:hover {
            background: #c82333;
        }

        button.success {
            background: #28a745;
        }

        button.success:hover {
            background: #218838;
        }

        .task-item {
            background: #f8f9fa;
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 3px;
            border-left: 4px solid #007bff;
        }

        .task-item.completed {
            border-left-color: #28a745;
        }

        .task-item.in-progress {
            border-left-color: #ffc107;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .task-title {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .task-meta {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 0.5rem;
        }

        .task-actions {
            display: flex;
            gap: 0.5rem;
        }

        .hidden {
            display: none;
        }

        .error {
            color: #dc3545;
            background: #f8d7da;
            padding: 0.5rem;
            border-radius: 3px;
            margin-bottom: 1rem;
        }

        .success {
            color: #155724;
            background: #d4edda;
            padding: 0.5rem;
            border-radius: 3px;
            margin-bottom: 1rem;
        }

        .user-info {
            text-align: right;
            margin-bottom: 1rem;
        }

        .filter-section {
            margin-bottom: 1rem;
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .filter-section select {
            width: auto;
            min-width: 120px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Simple Task Manager</h1>
        </div>

        <!-- Authentication Section -->
        <div id="auth-section" class="auth-section">
            <h2>Login / Register</h2>
            <div id="auth-error" class="error hidden"></div>
            <div id="auth-success" class="success hidden"></div>
            
            <div id="login-form">
                <h3>Login</h3>
                <div class="form-group">
                    <label for="login-username">Username or Email:</label>
                    <input type="text" id="login-username" placeholder="Enter username or email">
                </div>
                <div class="form-group">
                    <label for="login-password">Password:</label>
                    <input type="password" id="login-password" placeholder="Enter password">
                </div>
                <button onclick="login()">Login</button>
                <button onclick="showRegisterForm()">Register Instead</button>
            </div>

            <div id="register-form" class="hidden">
                <h3>Register</h3>
                <div class="form-group">
                    <label for="register-username">Username:</label>
                    <input type="text" id="register-username" placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label for="register-email">Email:</label>
                    <input type="email" id="register-email" placeholder="Enter email">
                </div>
                <div class="form-group">
                    <label for="register-password">Password:</label>
                    <input type="password" id="register-password" placeholder="Enter password">
                </div>
                <button onclick="register()">Register</button>
                <button onclick="showLoginForm()">Login Instead</button>
            </div>
        </div>

        <!-- Task Management Section -->
        <div id="task-section" class="task-section hidden">
            <div class="user-info">
                <span id="user-welcome"></span>
                <button onclick="logout()">Logout</button>
            </div>

            <h2>Task Management</h2>
            <div id="task-error" class="error hidden"></div>
            <div id="task-success" class="success hidden"></div>

            <!-- Add Task Form -->
            <div id="add-task-form">
                <h3>Add New Task</h3>
                <div class="form-group">
                    <label for="task-title">Title:</label>
                    <input type="text" id="task-title" placeholder="Enter task title">
                </div>
                <div class="form-group">
                    <label for="task-description">Description:</label>
                    <textarea id="task-description" placeholder="Enter task description"></textarea>
                </div>
                <div class="form-group">
                    <label for="task-priority">Priority:</label>
                    <select id="task-priority">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                <button onclick="addTask()">Add Task</button>
            </div>

            <!-- Filter Tasks -->
            <div class="filter-section">
                <label for="filter-status">Filter by Status:</label>
                <select id="filter-status" onchange="loadTasks()">
                    <option value="">All</option>
                    <option value="pending">Pending</option>
                    <option value="in-progress">In Progress</option>
                    <option value="completed">Completed</option>
                </select>
                
                <label for="filter-priority">Filter by Priority:</label>
                <select id="filter-priority" onchange="loadTasks()">
                    <option value="">All</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
            </div>

            <!-- Task List -->
            <div id="task-list">
                <h3>Your Tasks</h3>
                <div id="tasks-container">
                    <!-- Tasks will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:3000/api';
        let authToken = localStorage.getItem('authToken');
        let currentUser = null;

        // Initialize app
        document.addEventListener('DOMContentLoaded', function() {
            if (authToken) {
                verifyToken();
            }
        });

        // Helper functions
        function showElement(id) {
            document.getElementById(id).classList.remove('hidden');
        }

        function hideElement(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function showError(sectionId, message) {
            const errorElement = document.getElementById(`${sectionId}-error`);
            errorElement.textContent = message;
            showElement(`${sectionId}-error`);
        }

        function showSuccess(sectionId, message) {
            const successElement = document.getElementById(`${sectionId}-success`);
            successElement.textContent = message;
            showElement(`${sectionId}-success`);
        }

        function clearMessages(sectionId) {
            hideElement(`${sectionId}-error`);
            hideElement(`${sectionId}-success`);
        }

        // Authentication functions
        function showLoginForm() {
            showElement('login-form');
            hideElement('register-form');
            clearMessages('auth');
        }

        function showRegisterForm() {
            hideElement('login-form');
            showElement('register-form');
            clearMessages('auth');
        }

        async function register() {
            clearMessages('auth');
            
            const username = document.getElementById('register-username').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;

            if (!username || !email || !password) {
                showError('auth', 'All fields are required');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    authToken = data.token;
                    currentUser = data.user;
                    localStorage.setItem('authToken', authToken);
                    showTaskSection();
                    showSuccess('auth', 'Registration successful!');
                } else {
                    showError('auth', data.error || 'Registration failed');
                }
            } catch (error) {
                showError('auth', 'Network error. Please try again.');
            }
        }

        async function login() {
            clearMessages('auth');
            
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            if (!username || !password) {
                showError('auth', 'Username and password are required');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    authToken = data.token;
                    currentUser = data.user;
                    localStorage.setItem('authToken', authToken);
                    showTaskSection();
                    showSuccess('auth', 'Login successful!');
                } else {
                    showError('auth', data.error || 'Login failed');
                }
            } catch (error) {
                showError('auth', 'Network error. Please try again.');
            }
        }

        async function verifyToken() {
            try {
                const response = await fetch(`${API_BASE_URL}/auth/verify`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ token: authToken })
                });

                const data = await response.json();

                if (response.ok) {
                    currentUser = data.user;
                    showTaskSection();
                } else {
                    logout();
                }
            } catch (error) {
                logout();
            }
        }

        function logout() {
            authToken = null;
            currentUser = null;
            localStorage.removeItem('authToken');
            hideElement('task-section');
            showElement('auth-section');
            clearMessages('auth');
            clearMessages('task');
        }

        function showTaskSection() {
            hideElement('auth-section');
            showElement('task-section');
            document.getElementById('user-welcome').textContent = `Welcome, ${currentUser.username}!`;
            loadTasks();
        }

        // Task management functions
        async function addTask() {
            clearMessages('task');
            
            const title = document.getElementById('task-title').value;
            const description = document.getElementById('task-description').value;
            const priority = document.getElementById('task-priority').value;

            if (!title) {
                showError('task', 'Task title is required');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/tasks`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ title, description, priority })
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById('task-title').value = '';
                    document.getElementById('task-description').value = '';
                    document.getElementById('task-priority').value = 'medium';
                    showSuccess('task', 'Task added successfully!');
                    loadTasks();
                } else {
                    showError('task', data.error || 'Failed to add task');
                }
            } catch (error) {
                showError('task', 'Network error. Please try again.');
            }
        }

        async function loadTasks() {
            const statusFilter = document.getElementById('filter-status').value;
            const priorityFilter = document.getElementById('filter-priority').value;
            
            let url = `${API_BASE_URL}/tasks`;
            const params = new URLSearchParams();
            if (statusFilter) params.append('status', statusFilter);
            if (priorityFilter) params.append('priority', priorityFilter);
            if (params.toString()) url += '?' + params.toString();

            try {
                const response = await fetch(url, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    displayTasks(data.tasks);
                } else {
                    showError('task', data.error || 'Failed to load tasks');
                }
            } catch (error) {
                showError('task', 'Network error. Please try again.');
            }
        }

        function displayTasks(tasks) {
            const container = document.getElementById('tasks-container');
            
            if (tasks.length === 0) {
                container.innerHTML = '<p>No tasks found.</p>';
                return;
            }

            container.innerHTML = tasks.map(task => `
                <div class="task-item ${task.status}">
                    <div class="task-header">
                        <div class="task-title">${task.title}</div>
                        <div class="task-actions">
                            <button onclick="updateTaskStatus(${task.id}, 'in-progress')" ${task.status === 'in-progress' ? 'disabled' : ''}>
                                In Progress
                            </button>
                            <button class="success" onclick="updateTaskStatus(${task.id}, 'completed')" ${task.status === 'completed' ? 'disabled' : ''}>
                                Complete
                            </button>
                            <button class="danger" onclick="deleteTask(${task.id})">Delete</button>
                        </div>
                    </div>
                    <div class="task-meta">
                        Status: ${task.status} | Priority: ${task.priority} | Created: ${new Date(task.created_at).toLocaleDateString()}
                    </div>
                    ${task.description ? `<div class="task-description">${task.description}</div>` : ''}
                </div>
            `).join('');
        }

        async function updateTaskStatus(taskId, status) {
            try {
                const response = await fetch(`${API_BASE_URL}/tasks/${taskId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ status })
                });

                const data = await response.json();

                if (response.ok) {
                    showSuccess('task', `Task marked as ${status}!`);
                    loadTasks();
                } else {
                    showError('task', data.error || 'Failed to update task');
                }
            } catch (error) {
                showError('task', 'Network error. Please try again.');
            }
        }

        async function deleteTask(taskId) {
            if (!confirm('Are you sure you want to delete this task?')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/tasks/${taskId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    showSuccess('task', 'Task deleted successfully!');
                    loadTasks();
                } else {
                    showError('task', data.error || 'Failed to delete task');
                }
            } catch (error) {
                showError('task', 'Network error. Please try again.');
            }
        }
    </script>
</body>
</html>
