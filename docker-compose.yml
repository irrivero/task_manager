services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: task_manager
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - task-network

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://admin:password@postgres:5432/task_manager
      - JWT_SECRET=your-secret-key
    depends_on:
      - postgres
    networks:
      - task-network

  task-service:
    build:
      context: ./services/task-service
      dockerfile: Dockerfile
    ports:
      - "3002:3000"
    environment:
      - DATABASE_URL=postgresql://admin:password@postgres:5432/task_manager
    depends_on:
      - postgres
    networks:
      - task-network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - USER_SERVICE_URL=http://user-service:3000
      - TASK_SERVICE_URL=http://task-service:3000
    depends_on:
      - user-service
      - task-service
    networks:
      - task-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api-gateway
    networks:
      - task-network

volumes:
  postgres_data:

networks:
  task-network:
    driver: bridge